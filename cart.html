<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Review your Mino Kitchens cart and update item quantities.">
  <title>Cart | Mino Kitchens</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <site-header></site-header>

  <main>
    <section class="cart-page">
      <h1>Your Cart</h1>

      <div id="cart-items"></div>

      <aside id="cart-summary" class="cart-summary" aria-label="Cart summary">
        <span>Subtotal</span>
        <strong id="cart-subtotal">$0.00</strong>
        <p>Shipping and taxes are calculated at checkout.</p>
      </aside>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="js/core/cart.js"></script>
  <script src="js/ui/site-components.js"></script>
  <script src="js/ui/cart-count.js"></script>
  <script src="js/ui/cart-page.js"></script>
</body>
</html>
