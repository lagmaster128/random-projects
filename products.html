<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse kitchen appliances by collection, search, and price.">
  <title>Products | Kitchen Shop</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <site-header></site-header>

  <main>

    <section class="products-page">

      <h1>All Products</h1>

      <p class="page-intro">
        Find dependable appliances for easier everyday cooking.
      </p>

      <div class="catalog-controls">
        <input
          type="search"
          id="search"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <label class="sort-control" for="sort">
          <span>Sort by</span>
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
          </select>
        </label>
      </div>

      <div
        id="collection-filters"
        class="category-filters"
        aria-label="Filter products by collection"
      ></div>

      <p id="product-count" class="product-count" aria-live="polite"></p>

      <div id="product-grid" class="product-grid">

      </div>

    </section>

  </main>
  <site-footer></site-footer>

  <script src="js/core/cart.js"></script>
  <script src="js/data/data-access.js"></script>
  <script src="js/ui/site-components.js"></script>
  <script src="js/ui/cart-count.js"></script>
  <script src="js/ui/product-ui.js"></script>
  <script src="js/products.js"></script>

</body>
</html>
