<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse practical kitchen products by category and price.">
  <title>Products | Mino Kitchens</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/polish.css">
  <script src="js/ui/site-loader.js"></script>
</head>

<body>

  <site-header></site-header>

  <main>

    <section class="products-page container section">
      <header class="page-header catalog-header">
        <p class="eyebrow">Individual essentials</p>
        <h1>Products</h1>
        <p class="page-intro">
          Practical tools for cooking, organization, and smaller spaces.
        </p>
      </header>

      <div class="catalog-controls">
        <input
          type="search"
          id="search"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <label class="sort-control" for="sort">
          <span>Sort by</span>
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
          </select>
        </label>
      </div>

      <div
        id="collection-filters"
        class="category-filters"
        aria-label="Filter products by collection"
      ></div>

      <p id="product-count" class="product-count" aria-live="polite"></p>

      <div id="product-grid" class="product-grid">

      </div>

    </section>

  </main>
  <site-footer></site-footer>

  <script src="js/data/validator.js"></script>
<script src="js/core/cart.js"></script>
  <script src="js/data/data-access.js"></script>
  <script src="js/ui/site-components.js"></script>
  <script src="js/ui/cart-count.js"></script>
  <script src="js/ui/guidance-ui.js"></script>
  <script src="js/ui/product-ui.js"></script>
  <script src="js/products.js"></script>

</body>
</html>
