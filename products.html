<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Kitchen Shop</title>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <header>
    <nav class="navbar">

      <div class="logo">
        Kitchen Shop
      </div>

      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>
        <li>
          <a href="cart.html">
             Cart (<span id="cart-count">0</span>)
          </a>
        </li>
      </ul>

    </nav>
  </header>

  <main>

    <section class="products-page">

      <h1>All Products</h1>

      <p class="page-intro">
        Find dependable appliances for easier everyday cooking.
      </p>

      <div class="catalog-controls">
        <input
          type="search"
          id="search"
          placeholder="Search products..."
          aria-label="Search products"
        >

        <label class="sort-control" for="sort">
          <span>Sort by</span>
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
          </select>
        </label>
      </div>

      <div class="category-filters" aria-label="Filter products by category">
        <button class="filter-button active" type="button" data-category="all">
          All
        </button>
        <button class="filter-button" type="button" data-category="Air Fryers">
          Air Fryers
        </button>
        <button class="filter-button" type="button" data-category="Coffee Makers">
          Coffee Makers
        </button>
        <button class="filter-button" type="button" data-category="Blenders">
          Blenders
        </button>
      </div>

      <p id="product-count" class="product-count" aria-live="polite"></p>

      <div id="product-grid" class="product-grid">

      </div>

    </section>

  </main>
  <script src="js/cart.js"></script>
  <script src="js/products.js"></script>

</body>
</html>
