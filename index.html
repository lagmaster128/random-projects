<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Build your first functional kitchen with useful essentials, complete bundles, and less guesswork from Mino Kitchens.">

    <title>Mino Kitchens | Essentials for your first kitchen</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/polish.css">
    <script src="js/ui/site-loader.js"></script>
  </head>

  <body>

    <site-header></site-header>

    <main>

      <section id="hero" class="section">
        <div class="hero-content container-narrow">
          <h1>Everything you need for your first kitchen. Nothing you don't.</h1>

          <p>
            Start with a clear plan, a small set of useful tools, and none of the clutter you don't need.
          </p>

          <div class="hero-actions">
            <a href="bundles.html" class="button button--primary hero-button">Browse Kitchen Bundles</a>
            <a href="products.html" class="button button--secondary secondary-button">Explore Essentials</a>
          </div>
        </div>
      </section>

      <section id="kitchen-journey" class="section">
        <mino-section-header
          heading="Start with the life you're actually living"
          copy="Think about your space, your routines, and what you want to cook. We'll help with the rest."
        ></mino-section-header>
        <div id="journey-grid" class="journey-grid"></div>
      </section>

      <section id="featured-bundles" class="section section-light">
        <mino-section-header
          heading="Start with a complete solution"
          copy="Each bundle covers a real kitchen routine, without padding the list with extras."
        ></mino-section-header>
        <div id="bundle-grid" class="bundle-grid"></div>
      </section>

      <section id="featured-products" class="section">
        <mino-section-header
          heading="Fill the gaps as they appear"
          copy="Already know what's missing? Add an individual essential without rebuilding the whole plan."
        ></mino-section-header>

        <div id="product-grid" class="product-grid"></div>
      </section>

      <section id="why-us" class="section">

        <mino-section-header
          heading="Why Mino Kitchens"
          copy="A product belongs here only if it makes everyday kitchen life easier."
        ></mino-section-header>

        <mino-brand-principles mode="homepage"></mino-brand-principles>

        <p class="section-followup-link">
          <a class="text-button" href="how-we-choose.html">See how we choose products</a>
        </p>

      </section>

    </main>

    <site-footer></site-footer>

    <script src="js/data/validator.js"></script>
    <script src="js/core/cart.js"></script>
    <script src="js/data/data-access.js"></script>
    <script src="js/data/bundle-access.js"></script>
    <script src="js/ui/site-components.js"></script>
    <script src="js/ui/cart-count.js"></script>
    <script src="js/ui/guidance-ui.js"></script>
    <script src="js/ui/brand-story-ui.js"></script>
    <script src="js/ui/product-ui.js"></script>
    <script src="js/ui/bundle-ui.js"></script>
    <script src="js/main.js"></script>

  </body>
</html>
